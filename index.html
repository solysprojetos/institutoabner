<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituto ABNER — Em manutenção</title>
<meta name="description" content="O site do Instituto ABNER está em manutenção. Voltamos em breve!">
<meta name="robots" content="noindex">
<link rel="icon" type="image/webp" href="assets/logo-abner.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#10379E;
  --azul-claro:#1565C0;
  --texto:#5A6570;
  --amarelo:#FBC02D;
  --vermelho:#E53935;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito Sans',sans-serif;
  color:var(--texto);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:24px;
  background:
    radial-gradient(1100px 520px at 88% -10%,#e8effd 0%,transparent 60%),
    radial-gradient(800px 420px at -10% 110%,#fdf6e0 0%,transparent 55%),#fff;
  overflow:hidden;
}
.peca{position:absolute;width:56px;opacity:.9;pointer-events:none;animation:flutua 7s ease-in-out infinite}
.p2{animation-delay:1.4s}.p3{animation-delay:2.8s}.p4{animation-delay:4.2s}
@keyframes flutua{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-18px) rotate(8deg)}
}
@media (prefers-reduced-motion:reduce){.peca{animation:none}}
main{max-width:620px}
main img.logo{width:min(300px,70vw);margin:0 auto 34px;display:block;
  filter:drop-shadow(0 16px 36px rgba(16,55,158,.2))}
h1{font-family:'Fraunces',serif;color:var(--azul);font-size:clamp(1.9rem,5.5vw,2.9rem);line-height:1.15;margin-bottom:16px}
h1 span{color:var(--vermelho)}
p{font-size:1.12rem;line-height:1.65;margin-bottom:10px}
.lema{margin-top:26px;display:inline-block;font-family:'Fraunces',serif;font-weight:700;
  color:var(--azul);font-size:1.15rem;padding:14px 28px;background:#fff;border-radius:14px;
  box-shadow:0 4px 16px rgba(16,55,158,.1);border-bottom:4px solid var(--amarelo)}
.insta{margin-top:30px}
.insta a{display:inline-block;background:var(--azul);color:#fff;font-weight:800;text-decoration:none;
  padding:13px 30px;border-radius:999px;transition:background .2s}
.insta a:hover{background:#0c2a7a}
@media (max-width:640px){.peca{width:40px}}
</style>
</head>
<body>

<img class="peca" src="assets/pecas/vermelha.webp" alt="" style="top:10%;left:8%">
<img class="peca p2" src="assets/pecas/verde.webp" alt="" style="bottom:14%;left:12%">
<img class="peca p3" src="assets/pecas/amarela.webp" alt="" style="top:16%;right:9%">
<img class="peca p4" src="assets/pecas/roxa.webp" alt="" style="bottom:10%;right:13%">

<main>
  <img class="logo" src="assets/logo-abner.webp" alt="Logo do Instituto ABNER: letra A azul acolhida por uma mão de quebra-cabeça colorido">
  <h1>Estamos montando as <span>últimas peças</span></h1>
  <p><strong>O site está em manutenção.</strong></p>
  <p>Voltamos em breve, ainda melhor, para cuidar de quem mais precisa.</p>
  <p class="lema">Servir transforma vidas.</p>
  <div class="insta">
    <a href="https://instagram.com/abnerprojetosocial" target="_blank" rel="noopener">Siga @abnerprojetosocial</a>
  </div>
</main>

</body>
</html>
