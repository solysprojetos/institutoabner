name: Diagnóstico do certificado

on: workflow_dispatch

permissions:
  pages: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Status do Pages na API do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== STATUS DO PAGES ====="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
      - name: Certificado real servido pelo domínio
        run: |
          echo "===== CERTIFICADO institutoabner.com.br ====="
          echo | timeout 20 openssl s_client -connect institutoabner.com.br:443 -servername institutoabner.com.br 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "TLS AINDA NAO DISPONIVEL"
          echo "===== RESPOSTA HTTPS ====="
          curl -sSI --max-time 20 https://institutoabner.com.br 2>&1 | head -6 || true
          echo "===== RESPOSTA HTTP ====="
          curl -sSI --max-time 20 http://institutoabner.com.br 2>&1 | head -6 || true
